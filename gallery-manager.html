</head><body class="gallery-manager"><header class="top"><div class="top-inner"><img class="logo" src="images/campus-mark.svg"><div><div class="school-name">Sandipani Gallery Manager</div><div class="school-sub">Secure photo upload • Google Drive storage</div></div><nav class="nav"><a href="admin.html">Admin</a><a href="gallery.html">Gallery</a></nav></div></header><main class="main"><div class="container"><div id="login" class="card manager-login"><span class="badge">SECURE GALLERY</span><h1>Gallery Manager</h1><p>Use the same Admin PIN as the main admin panel.</p><div class="field"><label>Admin PIN</label><input id="pin" type="password" inputmode="numeric"></div><button class="btn primary" id="loginBtn">Login</button><div id="loginMsg" class="message"></div></div><div id="panel" class="hidden"><div class="card"><div class="manager-head"><div><span class="badge">CONTENT MANAGEMENT</span><h1>Upload Gallery Photo</h1><p>Photos are stored in Google Drive section-wise.</p></div><a class="btn secondary" href="gallery.html">View Gallery</a></div><div class="manager-grid"><div><div class="field"><label>Gallery Section</label><select id="category"><option value="guest">Guest Lectures Photos</option><option value="industrial">Industrial Visit Photos</option><option value="classroom">Class Room Teaching</option><option value="activities">Student Activities</option></select></div><div class="field"><label>Photo Title</label><input id="title" placeholder="e.g. Guest Lecture by Industry Expert"></div><div class="field"><label>Select Image</label><input id="file" type="file" accept="image/*"></div><button class="btn primary" id="uploadBtn">Upload Photo</button><div id="status" class="message"></div></div><div><img id="preview" class="manager-preview hidden" alt="Preview"></div></div></div><div class="card"><h2>Uploaded Photos</h2><div id="list" class="manager-list"></div></div></div></div></main><script src="js/config.js"></script><script src="js/gallery-manager.js"></script></body></html>
